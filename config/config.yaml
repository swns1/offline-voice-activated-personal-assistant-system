wake_word:
  engine: openwakeword
  # Bundled pretrained openWakeWord model name, fully offline/free, no
  # account needed. A real "Hey Ash" phrase needs a model trained via
  # openWakeWord's own training pipeline -- see README. This value also
  # accepts a path to that trained .onnx file directly, e.g.
  # "models/hey_ash.onnx" (resolved relative to the project's models/
  # folder) or an absolute path.
  keyword: hey_jarvis
  threshold: 0.5

audio:
  input_device: null
  silence_ms: 900
  max_record_seconds: 8.0
  # Talk over Ash mid-response instead of waiting it out -- see the
  # caveat about echo on speaker+mic setups (no headset) in config.py.
  barge_in_enabled: true

browser:
  default: chrome
  profile_directory: null   # set in Phase 8 once a profile is pinned

hotkey:
  # A global keyboard shortcut (works even when Ash isn't the focused
  # window) that toggles mute. Set to null to disable it.
  toggle_mute: "ctrl+alt+m"

tray:
  # A system tray icon with a Quit option -- lets Ash run with no
  # visible console window, which is the point of `autostart` below
  # (it launches via pythonw.exe). Harmless to leave on from a terminal.
  enabled: true

registry:
  # Rescans the Start Menu + Steam library and rewrites
  # registry.auto.yaml on every startup (~1 second), so a game/app
  # installed since Ash last ran is voice-launchable without a manual
  # scripts/build_registry_auto.py run. (Ash also retries a single
  # rescan on the spot if a spoken app name doesn't match anything --
  # see ash/actions/open_app.py -- so this mainly controls the startup
  # case.) Set to false to only ever rescan when you run that script
  # yourself.
  auto_rescan_on_startup: true

# Launch Ash automatically at login. Applied on every startup (edit this
# and restart Ash -- no separate step needed), via the Windows Registry
# Run key -- see ash/utils/autostart.py.
autostart: false

security:
  # Extra check on top of the plain spoken "yes" when confirming a
  # risky action (shutting down, force-closing an app, clicking/typing
  # on screen): the confirmation
  # itself has to sound like you, matched against a voiceprint you
  # enroll once via scripts/enroll_voice.py. This is a classical
  # MFCC-similarity check, not a trained deep speaker-embedding model --
  # see README and ash/security/voice_gate.py for the accuracy caveats.
  # Fails open (falls back to plain yes/no) if nothing's enrolled.
  voice_gate_enabled: false
  # Cosine similarity (0-1) the confirmation audio must reach. Lower =
  # more lenient, higher = stricter (more false rejects of your own
  # voice, especially on a short answer like a single word "yes").
  voice_match_threshold: 0.85

weather:
  # celsius or fahrenheit. Your city isn't set here: tell Ash ("my city
  # is Manila") and it's stored encrypted, with your other personal data.
  units: celsius

privacy:
  # Include what you say (transcripts, search queries, reminder text)
  # in the log files under %LOCALAPPDATA%\Ash\logs. Off: logs show which
  # command ran but not its content. Typed text and remembered facts are
  # never logged either way. Turn on only while troubleshooting.
  log_transcripts: false
  # Log files older than this many days are deleted automatically.
  log_retention_days: 7

desktop_control:
  # Lets Ash click/type on your screen based on OCR'd text labels
  # ("click Save") -- the one feature here that directly manipulates
  # your desktop. Off by default; every action still asks "click 'X'?"
  # first even when enabled. Needs the same Tesseract OCR engine as
  # "read my screen" above. See README's "Guided desktop actions"
  # section for the real scope limits (text labels only, no icons) and
  # the display-scaling caveat.
  enabled: false

spotify:
  enabled: false
  # From a Spotify Developer Dashboard app you create yourself -- see
  # README for setup. client_secret is NOT set here: export it as the
  # SPOTIPY_CLIENT_SECRET environment variable instead.
  client_id: null
  redirect_uri: "http://127.0.0.1:8888/callback"

search:
  # DuckDuckGo's Instant Answer API -- free, no account/key, but a real
  # network call (a small, deliberate departure from fully-offline
  # operation). Set to false to keep "search for X" fully offline; it'll
  # point you at "search in browser for X" instead.
  enabled: true

calendar:
  # Reads/writes your local desktop Outlook calendar via COM. Requires
  # Outlook itself to be installed and configured -- no separate account
  # setup needed on Ash's side. Off by default since it touches real
  # personal data.
  enabled: false
  # Opt-in on top of the above: Ash is otherwise 100% reactive (never
  # speaks unless spoken to) -- with this on, it checks your calendar in
  # the background and speaks/toasts a heads-up shortly before a meeting
  # starts, unprompted. Each meeting is only ever announced once.
  proactive_reminders: false
  proactive_lookahead_minutes: 5
  proactive_poll_seconds: 60

ollama:
  # auto: use the local-AI features whenever Ollama is running on this
  # PC with `model` downloaded, and quietly do without them otherwise.
  # true/false: force them on or off.
  enabled: auto
  # Ollama itself is a separate local install (https://ollama.com), not
  # a pip package -- see README for setup. Ash falls back to asking this
  # model anything that isn't a known command and doesn't match an app.
  host: "http://localhost:11434"
  model: "llama3.2"
  # A separate pull from `model` -- needed only for "what's on my
  # screen"-style requests. See README's "Screen understanding" section.
  vision_model: "llama3.2-vision"
  system_prompt: >
    You are Ash, a local voice assistant running entirely offline on the
    user's PC. Keep answers brief (1-3 sentences) since they will be read
    aloud by text-to-speech. Do not use markdown, bullet points, or any
    formatting -- plain spoken sentences only.
