wake_word:
  engine: openwakeword
  # Bundled pretrained openWakeWord model name, fully offline/free, no
  # account needed. A real "Hey Ash" phrase would need local training
  # (openWakeWord's synthetic-data pipeline) -- see README for notes.
  keyword: hey_jarvis
  threshold: 0.5

audio:
  input_device: null
  silence_ms: 900
  max_record_seconds: 8.0

browser:
  default: chrome
  profile_directory: null   # set in Phase 8 once a profile is pinned

hotkey:
  toggle_mute: "ctrl+alt+m"

autostart: false

spotify:
  enabled: false
  # From a Spotify Developer Dashboard app you create yourself -- see
  # README for setup. client_secret is NOT set here: export it as the
  # SPOTIPY_CLIENT_SECRET environment variable instead.
  client_id: null
  redirect_uri: "http://127.0.0.1:8888/callback"

search:
  # DuckDuckGo's Instant Answer API -- free, no account/key, but a real
  # network call (a small, deliberate departure from fully-offline
  # operation). Set to false to keep "search for X" fully offline; it'll
  # point you at "search in browser for X" instead.
  enabled: true

calendar:
  # Reads/writes your local desktop Outlook calendar via COM. Requires
  # Outlook itself to be installed and configured -- no separate account
  # setup needed on Ash's side. Off by default since it touches real
  # personal data.
  enabled: false

ollama:
  enabled: false
  # Ollama itself is a separate local install (https://ollama.com), not
  # a pip package -- see README for setup. Ash falls back to asking this
  # model anything that isn't a known command and doesn't match an app.
  host: "http://localhost:11434"
  model: "llama3.2"
  system_prompt: >
    You are Ash, a local voice assistant running entirely offline on the
    user's PC. Keep answers brief (1-3 sentences) since they will be read
    aloud by text-to-speech. Do not use markdown, bullet points, or any
    formatting -- plain spoken sentences only.
