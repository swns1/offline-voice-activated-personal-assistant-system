wake_word:
  engine: openwakeword
  # Bundled pretrained openWakeWord model name, fully offline/free, no
  # account needed. A real "Hey Ash" phrase needs a model trained via
  # openWakeWord's own training pipeline -- see README. This value also
  # accepts a path to that trained .onnx file directly, e.g.
  # "models/hey_ash.onnx" (resolved relative to the project's models/
  # folder) or an absolute path.
  keyword: hey_jarvis
  threshold: 0.5

audio:
  input_device: null
  silence_ms: 900
  max_record_seconds: 8.0
  # Talk over Ash mid-response instead of waiting it out -- see the
  # caveat about echo on speaker+mic setups (no headset) in config.py.
  barge_in_enabled: true

browser:
  default: chrome
  profile_directory: null   # set in Phase 8 once a profile is pinned

hotkey:
  # A global keyboard shortcut (works even when Ash isn't the focused
  # window) that toggles mute. Set to null to disable it.
  toggle_mute: "ctrl+alt+m"

tray:
  # A system tray icon with a Quit option -- lets Ash run with no
  # visible console window, which is the point of `autostart` below
  # (it launches via pythonw.exe). Harmless to leave on from a terminal.
  enabled: true

# Launch Ash automatically at login. Applied on every startup (edit this
# and restart Ash -- no separate step needed), via the Windows Registry
# Run key -- see ash/utils/autostart.py.
autostart: false

spotify:
  enabled: false
  # From a Spotify Developer Dashboard app you create yourself -- see
  # README for setup. client_secret is NOT set here: export it as the
  # SPOTIPY_CLIENT_SECRET environment variable instead.
  client_id: null
  redirect_uri: "http://127.0.0.1:8888/callback"

search:
  # DuckDuckGo's Instant Answer API -- free, no account/key, but a real
  # network call (a small, deliberate departure from fully-offline
  # operation). Set to false to keep "search for X" fully offline; it'll
  # point you at "search in browser for X" instead.
  enabled: true

calendar:
  # Reads/writes your local desktop Outlook calendar via COM. Requires
  # Outlook itself to be installed and configured -- no separate account
  # setup needed on Ash's side. Off by default since it touches real
  # personal data.
  enabled: false

ollama:
  enabled: false
  # Ollama itself is a separate local install (https://ollama.com), not
  # a pip package -- see README for setup. Ash falls back to asking this
  # model anything that isn't a known command and doesn't match an app.
  host: "http://localhost:11434"
  model: "llama3.2"
  # A separate pull from `model` -- needed only for "what's on my
  # screen"-style requests. See README's "Screen understanding" section.
  vision_model: "llama3.2-vision"
  system_prompt: >
    You are Ash, a local voice assistant running entirely offline on the
    user's PC. Keep answers brief (1-3 sentences) since they will be read
    aloud by text-to-speech. Do not use markdown, bullet points, or any
    formatting -- plain spoken sentences only.
