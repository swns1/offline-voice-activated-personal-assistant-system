[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ash"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ash*"]

[tool.pytest.ini_options]
# Only collect real tests -- without this, pytest also scans scripts/
# and imports anything there named like a test file.
testpaths = ["tests"]
