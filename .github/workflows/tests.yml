name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # Ash is Windows-only (DPAPI, SAPI voices, the Windows media and
    # notification APIs), so the tests run on Windows too.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
          pip install -e .

      - name: Lint
        run: ruff check ash tests scripts

      - name: Test
        # Headless: the window tests draw offscreen. No test uses the
        # microphone, speakers, network or real personal data (see
        # tests/conftest.py's safety net).
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
